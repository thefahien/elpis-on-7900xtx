# TabbyAPI config: Qwen3.8-27B EXL3 4.00bpw + DFlash2 EXL3 4.00bpw (the "elpis" pair) on an RX 7900 XTX 24 GB.
# 8-bit main KV (the ROCm attention kernels cover Q8/FP16 only), draft KV Q4.
# 131072 tokens is the measured ceiling with these 4.00bpw weights: peak 22.45 GiB on a 122k-token prompt.
network:
  host: 0.0.0.0
  port: 8096
  disable_auth: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: /models
  model_name: qwen38-27b-exl3
  backend: exllamav3
  max_seq_len: 131072
  cache_size: 131072
  cache_mode: Q8
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: 2048
  max_batch_size: 1
  vision: true
  vision_offload: true
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  tool_format: qwen3_coder

draft_model:
  draft_mode: model
  draft_model_dir: /models
  draft_model_name: dflash2-exl3
  draft_cache_mode: Q4

memory:
  sysmem_recurrent_cache: 4096
